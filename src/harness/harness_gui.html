<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>roy_harness</title>
<style nonce="__NONCE__">
:root{--bg:#fafaf9;--panel:#f1f0ee;--card:#fff;--line:#d9d6d0;--text:#1c1b19;--dim:#6b675f;
--accent:#2563eb;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;--user:#e8effd;--mono:ui-monospace,Consolas,monospace}
@media(prefers-color-scheme:dark){:root{--bg:#161513;--panel:#1f1d1a;--card:#262421;--line:#3a3733;
--text:#ecebe8;--dim:#9b968c;--accent:#6ea0ff;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--user:#1f2a44}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 system-ui,"Microsoft JhengHei",sans-serif;display:flex}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:var(--bad)}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:5px 8px;width:100%}
#side{width:260px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
#side h2{font-size:12px;color:var(--dim);margin:12px 12px 4px;font-weight:600;text-transform:uppercase}
#newform{padding:8px 12px;display:grid;gap:6px;border-bottom:1px solid var(--line)}
#list{overflow:auto;flex:1}
.item{padding:7px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.item:hover,.item.on{background:var(--card)}
.item .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--dim);margin-right:6px}
.dot.run{background:var(--ok)}.dot.wait{background:var(--warn);animation:b 1s infinite}
@keyframes b{50%{opacity:.25}}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#tabs{display:flex;gap:2px;background:var(--panel);border-bottom:1px solid var(--line);padding:6px 8px 0;overflow-x:auto}
.tab{padding:5px 10px;border:1px solid var(--line);border-bottom:0;border-radius:6px 6px 0 0;cursor:pointer;white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis}
.tab.on{background:var(--bg)}
.tab .x{margin-left:8px;color:var(--dim)}
#body{flex:1;display:flex;min-height:0}
#views{flex:1;display:flex;flex-direction:column;min-width:0}
.view{flex:1;display:none;flex-direction:column;min-height:0}
.view.on{display:flex}
.log{flex:1;overflow:auto;padding:12px 16px}
.msg{margin:8px 0;padding:8px 12px;border-radius:8px;white-space:pre-wrap;word-break:break-word}
.msg.user{background:var(--user);margin-left:10%}
.msg.bot{background:var(--card);border:1px solid var(--line);margin-right:10%}
.msg pre{background:var(--panel);padding:8px;border-radius:6px;overflow:auto;font:12.5px var(--mono);white-space:pre;margin:6px 0}
.sys{color:var(--dim);font:12px var(--mono);white-space:pre-wrap;word-break:break-word;margin:2px 0}
.sys.err{color:var(--bad)}
details.tool{margin:6px 0;border:1px solid var(--line);border-radius:6px;background:var(--card)}
details.tool summary{padding:4px 10px;cursor:pointer;font:12.5px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.tool.err summary{color:var(--bad)}details.tool.pending summary{color:var(--dim)}
details.tool pre{margin:0;padding:8px 10px;border-top:1px solid var(--line);font:12px var(--mono);white-space:pre-wrap;word-break:break-word;max-height:320px;overflow:auto}
.ask{border:2px solid var(--warn);border-radius:8px;padding:10px 12px;margin:8px 0;background:var(--card)}
.ask pre{font:13px var(--mono);white-space:pre-wrap;word-break:break-word;margin:6px 0;max-height:260px;overflow:auto}
.ask .row{display:flex;gap:8px;flex-wrap:wrap}
.banner{padding:8px 12px;background:var(--panel);border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
.compose{display:flex;gap:8px;padding:8px 12px;border-top:1px solid var(--line);background:var(--panel)}
.compose textarea{resize:none;height:56px}
#right{width:250px;border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:8px 12px}
#right h3{font-size:12px;color:var(--dim);margin:12px 0 4px;text-transform:uppercase}
#right .cmds{display:flex;flex-wrap:wrap;gap:4px}
#right .cmds button{padding:2px 8px;font-size:12px}
.task{display:flex;justify-content:space-between;gap:6px;font-size:12px;padding:3px 0;border-bottom:1px solid var(--line)}
.task span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.st{font-size:12px;width:100%}table.st td:last-child{text-align:right;font-family:var(--mono)}
#empty{margin:auto;color:var(--dim)}
@media(max-width:900px){#right{display:none}#side{width:200px}}
</style>
</head>
<body>
<aside id="side">
  <h2>新 session</h2>
  <div id="newform">
    <input id="cwd" list="cwds" placeholder="專案資料夾（絕對路徑）"><datalist id="cwds"></datalist>
    <div style="display:flex;gap:6px">
      <select id="mode"><option>normal</option><option>safe</option><option>auto</option></select>
      <button class="primary" id="create">建立</button>
    </div>
  </div>
  <h2>所有 session</h2>
  <div id="list"></div>
</aside>
<section id="main">
  <div id="tabs"></div>
  <div id="body">
    <div id="views"><div id="empty">在左邊建立或選一個 session</div></div>
    <aside id="right"></aside>
  </div>
</section>
<script nonce="__NONCE__">
"use strict";
// Everything that comes from the model, the files or the tools goes in with textContent only.
let TOKEN = "";
try {
  const m = location.hash.match(/t=([\w-]+)/);
  if (m) { sessionStorage.setItem("t", m[1]); history.replaceState(null, "", location.pathname); }
  TOKEN = sessionStorage.getItem("t") || "";
} catch (e) {}
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const V = new Map();          // sid -> view
let ACTIVE = null, LIST = [];

async function api(method, path, body) {
  const r = await fetch(path, {method, headers: {"Authorization": "Bearer " + TOKEN, "Content-Type": "application/json"},
    body: body === undefined ? undefined : JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}

// ---- sidebar
async function refresh() {
  try {
    const j = await api("GET", "/api/sessions");
    LIST = j.sessions;
    if (!$("cwd").value) $("cwd").value = j.default_cwd;
    const dl = $("cwds"); dl.replaceChildren();
    for (const c of [j.default_cwd, ...j.recent_cwds]) { const o = el("option"); o.value = c; dl.append(o); }
    const box = $("list"); box.replaceChildren();
    for (const s of LIST) {
      const it = el("div", "item" + (s.id === ACTIVE ? " on" : ""));
      const t = el("div", "t"); const d = el("span", "dot" + (s.waiting ? " wait" : s.running ? " run" : ""));
      t.append(d, s.title || "(新 session)");
      it.append(t, el("div", "s", s.cwd + " · " + s.mode + " · " + new Date(s.updated * 1000).toLocaleString()));
      it.onclick = () => openSession(s.id);
      box.append(it);
    }
    renderTabs();
  } catch (e) { if (String(e.message) === "401") document.body.textContent = "token 失效：請用啟動時印出的網址重新開啟"; }
}
$("create").onclick = async () => {
  try { const s = await api("POST", "/api/sessions", {cwd: $("cwd").value.trim(), mode: $("mode").value}); await refresh(); openSession(s.id); }
  catch (e) { alert("建立失敗：" + e.message); }
};

// ---- tabs
function info(sid) { return LIST.find((s) => s.id === sid) || {}; }
function renderTabs() {
  const bar = $("tabs"); bar.replaceChildren();
  for (const [sid, v] of V) {
    const i = info(sid);
    const t = el("div", "tab" + (sid === ACTIVE ? " on" : ""));
    t.append(el("span", "dot" + (v.pending.size ? " wait" : v.alive ? " run" : "")), i.title || "(新)");
    const x = el("span", "x", "×"); x.title = "關閉分頁（不停止 session）";
    x.onclick = (e) => { e.stopPropagation(); closeTab(sid); };
    t.append(x); t.onclick = () => activate(sid); bar.append(t);
  }
  document.title = [...V.values()].some((v) => v.pending.size) ? "(待核准) roy_harness" : "roy_harness";
}
function closeTab(sid) {
  const v = V.get(sid); if (!v) return;
  v.closed = true; if (v.ctl) v.ctl.abort(); v.root.remove(); V.delete(sid);
  if (ACTIVE === sid) { ACTIVE = null; const n = V.keys().next().value; if (n) activate(n); else renderRight(); }
  renderTabs();
}
function activate(sid) {
  ACTIVE = sid;
  for (const [id, v] of V) v.root.classList.toggle("on", id === sid);
  $("empty").style.display = "none"; renderTabs(); renderRight(); refresh();
  const v = V.get(sid); if (v) v.input.focus();
}
function openSession(sid) {
  if (!V.has(sid)) {
    const v = newView(sid); V.set(sid, v); $("views").append(v.root); follow(v);
  }
  activate(sid);
}

// ---- one session view
function newView(sid) {
  const root = el("div", "view");
  const log = el("div", "log"), banner = el("div", "banner"), compose = el("div", "compose");
  const input = el("textarea"); input.placeholder = "訊息（Enter 送出，Shift+Enter 換行；/help 看指令）";
  const send = el("button", "primary", "送出");
  compose.append(input, send); root.append(log, banner, compose);
  banner.style.display = "none";
  const v = {id: sid, root, log, banner, input, seq: 0, pending: new Map(), tools: new Map(), cur: null,
             alive: false, busy: false, state: null, closed: false, ready: null, ctl: null};
  const go = async () => {
    const text = input.value; if (!text.trim()) return;
    try { await api("POST", `/api/sessions/${sid}/send`, {text}); input.value = ""; }
    catch (e) { sysLine(v, "送出失敗：" + e.message, true); }
  };
  send.onclick = go;
  input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); go(); } });
  return v;
}
function stick(v, fn) {
  const near = v.log.scrollHeight - v.log.scrollTop - v.log.clientHeight < 80;
  fn(); if (near) v.log.scrollTop = v.log.scrollHeight;
}
function sysLine(v, text, err) { stick(v, () => v.log.append(el("div", "sys" + (err ? " err" : ""), text))); }

// text with ``` fences -> text + <pre>, built from DOM nodes only
function renderText(node, text) {
  node.replaceChildren();
  const parts = text.split("```");
  parts.forEach((p, i) => {
    if (i % 2 === 0) { if (p) node.append(document.createTextNode(p)); }
    else { const nl = p.indexOf("\n"); node.append(el("pre", "", nl >= 0 ? p.slice(nl + 1) : p)); }
  });
}
function botBubble(v) {
  const b = el("div", "msg bot"); stick(v, () => v.log.append(b)); return b;
}
function short(s, n) { s = String(s).replace(/\s+/g, " "); return s.length > n ? s.slice(0, n) + "…" : s; }
function prettyArgs(a) { try { return JSON.stringify(JSON.parse(a), null, 1); } catch (e) { return a; } }

function flushUsage(v) {
  v.ended = false;
  if (v.held) { sysLine(v, v.held); v.held = null; }
}

function handle(v, ev) {
  v.seq = ev.seq + 1;
  switch (ev.kind) {
    case "user": stick(v, () => v.log.append(el("div", "msg user", ev.text))); break;
    case "assistant_delta":
      if (!v.cur) v.cur = {node: botBubble(v), text: ""};
      v.cur.text += ev.text;
      if (!v.cur.raf) v.cur.raf = requestAnimationFrame(() => { const c = v.cur; if (!c) return; c.raf = 0; stick(v, () => renderText(c.node, c.text)); });
      break;
    case "assistant_end":
      if (v.cur) { const c = v.cur; v.cur = null; stick(v, () => renderText(c.node, c.text)); }
      v.ended = true;                                      // streamed: the usage line comes next, in the right place
      break;
    case "assistant": { const b = botBubble(v); stick(v, () => renderText(b, ev.text)); flushUsage(v); break; }
    case "tool_call": {
      flushUsage(v);
      const d = el("details", "tool pending");
      d.append(el("summary", "", (ev.label ? ev.label + " " : "") + ev.name + "(" + short(ev.args, 100) + ")"));
      d.append(el("pre", "", prettyArgs(ev.args)));
      const res = el("pre", "", "(執行中…)"); d.append(res);
      v.tools.set(ev.id, {d, res}); stick(v, () => v.log.append(d)); break;
    }
    case "tool_result": {
      const t = v.tools.get(ev.id); if (!t) break;
      t.d.classList.remove("pending");
      if (/^(ERROR|BLOCKED|DENIED|INTERRUPTED)/.test(ev.text)) t.d.classList.add("err");
      t.res.textContent = ev.text + (ev.chars > ev.text.length ? `\n…（共 ${ev.chars} 字元，只顯示前段）` : "");
      break;
    }
    case "ask": v.pending.set(ev.rid, ev); askCard(v, ev); renderTabs(); break;
    case "answered": {
      v.pending.delete(ev.rid); const c = v.log.querySelector(`[data-rid="${ev.rid}"]`); if (c) c.remove(); renderTabs(); break;
    }
    case "classifier": sysLine(v, `分類器 ${ev.verdict}：${ev.why}`); break;
    case "usage":                                          // the harness prints it before the answer's text; show it after
      v.held = `${ev.label || ""}in=${ev.tokens_in} cached=${ev.cached} out=${ev.tokens_out}` + (ev.ttft != null ? ` ttft=${ev.ttft.toFixed(2)}s` : "");
      if (v.ended) flushUsage(v);
      break;
    case "ready": v.alive = true; v.ready = ev; v.banner.style.display = "none"; sysLine(v, `已啟動：${ev.provider} / ${ev.model} · ${ev.cwd}`); renderTabs(); renderRight(); break;
    case "state": v.state = ev; if (ACTIVE === v.id) renderRight(); break;
    case "turn_start": v.busy = true; break;
    case "turn_end": flushUsage(v); v.busy = false; v.cur = null; break;
    case "exited": {
      v.alive = false; v.busy = false; v.pending.clear(); v.cur = null;
      v.log.querySelectorAll(".ask").forEach((c) => c.remove());     // nothing is waiting for them any more
      v.banner.replaceChildren(el("span", "", `harness 已結束（代碼 ${ev.code}）`));
      const b = el("button", "primary", "續跑");
      b.onclick = async () => { try { await api("POST", `/api/sessions/${v.id}/resume`, {}); } catch (e) { alert(e.message); } };
      v.banner.append(b); v.banner.style.display = "flex"; renderTabs(); renderRight(); break;
    }
    case "stderr": sysLine(v, ev.text, true); break;
    case "log": if (ev.text && ev.text.trim()) sysLine(v, ev.text); break;
    default: break;
  }
}
function askCard(v, ev) {
  const c = el("div", "ask"); c.dataset.rid = ev.rid;
  c.append(el("b", "", ev.question ? "agent 問你" : "需要核准"), el("pre", "", ev.what));
  const row = el("div", "row");
  const reply = async (text) => { try { await api("POST", `/api/sessions/${v.id}/answer`, {rid: ev.rid, text}); } catch (e) { sysLine(v, "回覆失敗：" + e.message, true); } };
  if (ev.question) {
    const i = el("input"); i.placeholder = "你的回答"; const b = el("button", "primary", "回答");
    b.onclick = () => reply(i.value); i.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.isComposing) reply(i.value); });
    row.append(i, b);
  } else {
    const y = el("button", "primary", "允許一次"); y.onclick = () => reply("y"); row.append(y);
    if (ev.always) { const a = el("button", "", "永遠允許這條"); a.onclick = () => reply("a"); row.append(a); }
    const n = el("button", "danger", "拒絕"); n.onclick = () => reply("n"); row.append(n);
  }
  c.append(row); stick(v, () => v.log.append(c));
}

async function follow(v) {
  const dec = new TextDecoder();
  while (!v.closed) {
    try {
      v.ctl = new AbortController();
      const r = await fetch(`/api/sessions/${v.id}/stream?from=${v.seq}`, {headers: {"Authorization": "Bearer " + TOKEN}, signal: v.ctl.signal});
      const rd = r.body.getReader(); let buf = "";
      for (;;) {
        const {value, done} = await rd.read(); if (done) break;
        buf += dec.decode(value, {stream: true}); let i;
        while ((i = buf.indexOf("\n")) >= 0) { const line = buf.slice(0, i); buf = buf.slice(i + 1); if (line.trim()) handle(v, JSON.parse(line)); }
      }
    } catch (e) { if (v.closed) return; }
    await new Promise((r) => setTimeout(r, 1500));
  }
}

// ---- right panel (active session)
function renderRight() {
  const p = $("right"); p.replaceChildren();
  const v = V.get(ACTIVE); if (!v) return;
  const st = v.state;
  p.append(el("h3", "", "模式"));
  const sel = el("select"); for (const m of ["safe", "normal", "auto"]) { const o = el("option", "", m); sel.append(o); }
  sel.value = (st && st.mode) || info(v.id).mode || "normal"; sel.disabled = !v.alive;
  sel.onchange = () => api("POST", `/api/sessions/${v.id}/send`, {text: "/mode " + sel.value}).catch((e) => alert(e.message));
  p.append(sel, el("div", "sys", "切換在這一輪結束後生效"));
  p.append(el("h3", "", "背景任務"));
  const tasks = (st && st.tasks) || [];
  if (!tasks.length) p.append(el("div", "sys", "（無）"));
  for (const t of tasks) {
    const row = el("div", "task"); row.append(el("span", "", `${t.id} ${t.kind} ${t.status} ${t.desc}`));
    if (t.status === "running") { const b = el("button", "danger", "停"); b.onclick = () => api("POST", `/api/sessions/${v.id}/send`, {text: "/stop " + t.id}); row.append(b); }
    p.append(row);
  }
  p.append(el("h3", "", "指令"));
  const cmds = el("div", "cmds");
  for (const c of ["/skills", "/mcp", "/hooks", "/perms", "/stats", "/tasks", "/undo", "/compact", "/clear"]) {
    const b = el("button", "", c); b.disabled = !v.alive;
    b.onclick = () => { if (c === "/clear" && !confirm("清掉這個 session 的對話？")) return; api("POST", `/api/sessions/${v.id}/send`, {text: c}); };
    cmds.append(b);
  }
  p.append(cmds);
  p.append(el("h3", "", "統計"));
  const tb = el("table", "st"), s = st && st.stats;
  if (s) for (const [k, n] of [["模型呼叫", s.model_calls], ["tokens in", s.tokens_in], ["tokens out", s.tokens_out], ["工具呼叫", s.tool_calls], ["工具錯誤", s.tool_errors], ["問過人", s.asked_human], ["壓縮", s.compactions]]) {
    const tr = el("tr"); tr.append(el("td", "", k), el("td", "", String(n))); tb.append(tr);
  }
  p.append(tb);
  if (v.alive) { const b = el("button", "danger", "停止 session（強制結束）"); b.style.marginTop = "14px";
    b.onclick = () => { if (confirm("強制結束這個 harness？進行中的工具呼叫會被標成 INTERRUPTED，之後可以續跑。")) api("POST", `/api/sessions/${v.id}/stop`, {}); };
    p.append(b); }
}

refresh(); setInterval(refresh, 5000);
</script>
</body>
</html>

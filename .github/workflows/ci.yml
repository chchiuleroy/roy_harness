name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一個 PR 又推新 commit 時，取消還在跑的舊 run，省分鐘數
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  offline-tests:
    # README 寫明只在 Windows 11 測過，所以用 Windows runner；
    # 公開 repo 的標準 GitHub-hosted runner 不扣額度。
    runs-on: windows-latest
    # 作者機器整套離線約 656 秒；給 CI 留餘裕，也避免卡死燒時間
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # 零第三方依賴，不需要 pip install；離線測試，不打真實伺服器（不設 HARNESS_LIVE）
      - name: Offline test suite
        run: python -X utf8 -m unittest discover -s tests

  # kb (the personal knowledge base, kb/) has its own suite. It is a separate job so it runs in parallel and the
  # offline-tests job above (the one branch protection requires) is unchanged. numpy (dense retrieval) and PyMuPDF
  # (PDF) are optional tiers of kb: without them 52 tests error and 4 modules fail to import, so they are installed here.
  # Versions are the ones the suite was run with on 2026-11-25 (clean clone, clean venv: 782 tests, OK, 1 skipped).
  kb-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: kb
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install the optional tiers
        run: python -m pip install numpy==2.5.5 pymupdf==2.1
      - name: kb test suite
        run: python -X utf8 run_tests.py
